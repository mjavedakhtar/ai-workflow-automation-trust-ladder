[project]
name = "trust-ladder"
version = "1.0.0"
description = "Safe AI automation for MSP operations — The Trust Ladder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "sqlalchemy>=2.0.40,<2.1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.8,<3",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "langgraph>=0.3.34,<0.4",
    "langgraph-checkpoint-sqlite>=2.0.6,<3",
    "google-genai>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.uv]
package = true
